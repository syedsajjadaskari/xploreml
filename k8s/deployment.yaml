apiVersion: apps/v1
kind: Deployment
metadata:
  name: xploreml-app
  namespace: xploreml
  labels:
    app: xploreml
    component: webapp
    version: v2.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xploreml
      component: webapp
  template:
    metadata:
      labels:
        app: xploreml
        component: webapp
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8501"
        prometheus.io/path: "/_stcore/health"
    spec:
      serviceAccountName: xploreml-sa
      containers:
      - name: xploreml
        image: gcr.io/xploreml/xploreml:latest
        ports:
        - containerPort: 8501
          name: http
          protocol: TCP
        env:
        - name: APP_NAME
          value: "XploreML"
        - name: APP_VERSION
          value: "v2.0.0"
        - name: ENVIRONMENT
          value: "production"
        - name: GCS_TEMP_BUCKET
          value: "gs://xploreml-temp-storage/"
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/gcs/key.json"
        - name: STREAMLIT_SERVER_HEADLESS
          value: "true"
        - name: STREAMLIT_SERVER_PORT
          value: "8501"
        - name: STREAMLIT_SERVER_ADDRESS
          value: "0.0.0.0"
        - name: PYTHONPATH
          value: "/app"
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
            ephemeral-storage: "1Gi"
          limits:
            memory: "4Gi"
            cpu: "1000m"
            ephemeral-storage: "2Gi"
        volumeMounts:
        - name: streamlit-config
          mountPath: /app/.streamlit
          readOnly: true
        - name: gcs-credentials
          mountPath: /etc/gcs
          readOnly: true
        - name: app-config
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        startupProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
      volumes:
      - name: streamlit-config
        configMap:
          name: xploreml-config
      - name: gcs-credentials
        secret:
          secretName: xploreml-gcs-credentials
      - name: app-config
        configMap:
          name: xploreml-app-config
          items:
          - key: config.yaml
            path: config.yaml
---
